# Builds an unsigned iPhone app (.ipa) on GitHub's macOS machines — no Mac or Expo account needed.
# Run it from GitHub → Actions → "iOS build" → Run workflow, then download the "TaskPlanner-ipa" artifact
# and install it on the iPhone with Sideloadly (it signs the app with your Apple ID).
name: iOS build

on:
  workflow_dispatch:

jobs:
  build:
    # Intel macOS runner: the Apple Silicon (arm64) runners behind macos-latest are often
    # capacity-limited. Intel builds the same iPhone (arm64) app; Xcode is picked below.
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # .env is not in the repo, so the app's public URLs are set here.
      EXPO_PUBLIC_API_URL: https://api.taskplanner.co.uk/api
      EXPO_PUBLIC_SOCKET_URL: https://api.taskplanner.co.uk
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc (legacy-peer-deps) is picked up automatically.
      - name: Install packages
        run: npm ci

      # SDK 58's Expo modules compile in Swift 6 language mode, where data-race diagnostics are
      # errors. The newest Xcode on this runner (26.x) rejects code that newer Xcode accepts
      # (e.g. expo-modules-jsi "sending 'slot' risks causing data races"). Swift 5 mode turns those
      # diagnostics into warnings; the code and runtime behaviour are unchanged. CI only.
      - name: Compile Expo pods in Swift 5 language mode
        run: |
          find node_modules -name "*.podspec" -print0 \
            | xargs -0 grep -lE "swift_version[[:space:]]*=[[:space:]]*['\"]6" \
            | while read -r spec; do
                echo "Swift 5 mode: $spec"
                perl -pi -e "s/(swift_version\s*=\s*)['\"]6[0-9.]*['\"]/\1'5.0'/" "$spec"
              done
          # Some modules (expo-modules-jsi) are built as Swift packages with their own language mode.
          find node_modules -name "Package.swift" -print0 \
            | xargs -0 grep -lE "swiftLanguageModes?[[:space:]]*:[[:space:]]*\[[[:space:]]*\.v6" \
            | while read -r pkg; do
                echo "Swift 5 mode: $pkg"
                perl -pi -e "s/(swiftLanguageModes?\s*:\s*\[\s*)\.v6/\1.v5/" "$pkg"
              done

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      # pod install downloads large React Native/Hermes tarballs from repo.reactnative.dev; the
      # connection sometimes drops ("Connection reset by peer"), so retry. Fails the job clearly
      # (instead of a confusing "no .xcworkspace" later) if it never succeeds.
      - name: Install CocoaPods (with retries)
        working-directory: ios
        run: |
          for attempt in 1 2 3; do
            echo "pod install — attempt $attempt"
            if pod install; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::pod install failed 3 times"; exit 1; fi
            sleep 30
          done
          ls -d *.xcworkspace

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TaskPlanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 14
