# Builds an unsigned iPhone app (.ipa) on GitHub's macOS machines — no Mac or Expo account needed.
# Run it from GitHub → Actions → "iOS build" → Run workflow, then download the "TaskPlanner-ipa" artifact
# and install it on the iPhone with Sideloadly (it signs the app with your Apple ID).
name: iOS build

on:
  workflow_dispatch:

jobs:
  build:
    # Apple Silicon macOS runner (faster than Intel). It can queue longer when GitHub is busy.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # .env is not in the repo, so the app's public URLs are set here.
      EXPO_PUBLIC_API_URL: https://api.taskplanner.co.uk/api
      EXPO_PUBLIC_SOCKET_URL: https://api.taskplanner.co.uk
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc (legacy-peer-deps) is picked up automatically.
      - name: Install packages
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      # pod install downloads large React Native/Hermes tarballs from repo.reactnative.dev; the
      # connection sometimes drops ("Connection reset by peer"), so retry. Fails the job clearly
      # (instead of a confusing "no .xcworkspace" later) if it never succeeds.
      - name: Install CocoaPods (with retries)
        working-directory: ios
        run: |
          for attempt in 1 2 3; do
            echo "pod install — attempt $attempt"
            if pod install; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::pod install failed 3 times"; exit 1; fi
            sleep 30
          done
          ls -d *.xcworkspace

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TaskPlanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 14
